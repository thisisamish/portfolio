# Every word on the site lives in this file.
# Wrap words in **double asterisks** to emphasise them (accent colour in most sections).
# Blog posts are the one exception: they will be separate files under src/content/writing/.
# Banned words are blocked at build time (see src/config/guardrails.ts).

